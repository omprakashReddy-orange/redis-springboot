version: '3.8'

services:
  Prometheus:
    image: prom/prometheus:latest
    container_name: product_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  Grafana:
    image: grafana/grafana:latest
    container_name: product_grafana
    ports:
      - "3000:3000"



  redis:
    image: redis:7-alpine
    container_name: product_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product_network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  product_network:
    driver: bridge
