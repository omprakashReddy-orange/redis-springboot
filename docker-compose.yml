version: '3.8'

services:
  Prometheus:
    image: prom/prometheus:latest
    container_name: product_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  Grafana:
    image: grafana/grafana:latest
    container_name: product_grafana
    ports:
      - "3000:3000"

  mysql:
    image: mysql:8.0
    container_name: product_mysql
    environment:
      MYSQL_ROOT_PASSWORD: integrator
      MYSQL_DATABASE: product_db
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - product_network


  redis:
    image: redis:7-alpine
    container_name: product_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product_network
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:

networks:
  product_network:
    driver: bridge
